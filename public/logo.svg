<svg width="512" height="512" viewBox="0 0 512 512" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Crypto Efectivo</title>
  <desc>Ícono de Crypto Efectivo — hexágono con candado encriptado sin fondo</desc>

  <!-- Hexágono exterior decorativo -->
  <polygon points="256,100 366,163 366,290 256,353 146,290 146,163" fill="none" stroke="#5891C7" stroke-width="3" opacity="0.3"/>

  <!-- Hexágono mediano -->
  <polygon points="256,118 354,174 354,285 256,341 158,285 158,174" fill="none" stroke="#5891C7" stroke-width="2" opacity="0.6"/>

  <!-- Hexágono principal -->
  <polygon points="256,136 342,185 342,284 256,333 170,284 170,185" fill="#5891C7" opacity="0.12"/>
  <polygon points="256,136 342,185 342,284 256,333 170,284 170,185" fill="none" stroke="#5891C7" stroke-width="2.5"/>

  <!-- Cuerpo del candado -->
  <rect x="224" y="236" width="64" height="50" rx="9" fill="#5891C7"/>

  <!-- Arco del candado -->
  <path d="M234 236 L234 214 Q256 192 278 214 L278 236" fill="none" stroke="#5891C7" stroke-width="6" stroke-linecap="round"/>

  <!-- Símbolo $ -->
  <text x="256" y="270" text-anchor="middle" font-family="'Courier New', monospace" font-size="22" font-weight="700" fill="#0D1B2A">$</text>

  <!-- Circuitos izquierda -->
  <line x1="146" y1="226" x2="88" y2="226" stroke="#5891C7" stroke-width="1.5" opacity="0.5"/>
  <circle cx="85" cy="226" r="4.5" fill="#5891C7" opacity="0.5"/>
  <circle cx="72" cy="226" r="3" fill="#5891C7" opacity="0.3"/>

  <!-- Circuitos derecha -->
  <line x1="366" y1="226" x2="424" y2="226" stroke="#5891C7" stroke-width="1.5" opacity="0.5"/>
  <circle cx="427" cy="226" r="4.5" fill="#5891C7" opacity="0.5"/>
  <circle cx="440" cy="226" r="3" fill="#5891C7" opacity="0.3"/>

  <!-- Inferior izquierda -->
  <line x1="170" y1="291" x2="110" y2="323" stroke="#5891C7" stroke-width="1.5" opacity="0.35"/>
  <circle cx="107" cy="325" r="4" fill="#5891C7" opacity="0.35"/>

  <!-- Inferior derecha -->
  <line x1="342" y1="291" x2="402" y2="323" stroke="#5891C7" stroke-width="1.5" opacity="0.35"/>
  <circle cx="405" cy="325" r="4" fill="#5891C7" opacity="0.35"/>
</svg>